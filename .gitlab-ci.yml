stages:
  - build

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_DEPTH: "1"
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${CI_REGISTRY}": {
            "auth": "$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
          }
        }
      }
      EOF
    - |
      DEST_ARGS="--destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      DEST_ARGS="$DEST_ARGS --destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        DEST_ARGS="$DEST_ARGS --destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        DEST_ARGS="$DEST_ARGS --destination ${CI_REGISTRY_IMAGE}:latest"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg "BUILD_ID=${CI_COMMIT_SHA}" \
        $DEST_ARGS \
        --cache=true \
        --cache-repo="${CI_REGISTRY_IMAGE}/cache" \
        --snapshot-mode=redo \
        --use-new-run \
        --compressed-caching=false
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
