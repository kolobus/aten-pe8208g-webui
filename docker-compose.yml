# docker compose up -d
#
# All runtime config is read from the .env file next to this compose file.
# See README.md for the full env reference. At minimum you need:
#   PDU_HOST
#   PDU_SNMP_READ_COMMUNITY
#   PDU_SNMP_V3_USER, PDU_SNMP_V3_AUTH_PASS, PDU_SNMP_V3_PRIV_PASS
# Optional but recommended when exposed beyond a trusted network:
#   AUTH_TOKEN              # generate with: openssl rand -hex 32
# Other knobs:
#   ELECTRICITY_RATE_PER_KWH (default 0.61)
#   CURRENCY_SYMBOL          (default ₪)
#   LOG_LEVEL                (error|warn|info|debug, default info)
#   PORT                     (default 3000)

services:
  pdu-controller:
    # Pick one: build locally, pull from GitLab registry, or pull from ghcr.io.
    build: .
    # image: registry.gitlab.com/kolobus/aten-pe8208g-webui:latest
    # image: ghcr.io/kolobus/aten-pe8208g-webui:latest

    container_name: pdu-controller
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"

    # Dockerfile already defines HEALTHCHECK against /live (3-min interval).
    # Uncomment to override:
    # healthcheck:
    #   interval: 1m
    #   timeout: 5s
    #   retries: 3

    # Hardening — image writes nothing to disk at runtime.
    read_only: true
    security_opt:
      - no-new-privileges:true

    # Cap resources if you want:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.25"
    #       memory: 128M
